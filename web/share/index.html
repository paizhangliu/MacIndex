<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0D98BA">
    <meta name="robots" content="noindex, nofollow">
    <title>Open in MacIndex</title>
    <style>
        :root {
            color-scheme: light dark;
            --macindex-blue: #0D98BA;
            --text: #25282A;
            --secondary: #686D70;
            --background: #F5F6F6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 28px 20px;
            color: var(--text);
            background: var(--background);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
        }

        main {
            width: min(100%, 440px);
            text-align: center;
        }

        .logo {
            width: 88px;
            height: 88px;
            border-radius: 20px;
        }

        h1 {
            margin: 20px 0 24px;
            color: var(--macindex-blue);
            font-size: 34px;
            line-height: 1.1;
            letter-spacing: -.025em;
        }

        p {
            margin: 8px 0;
            color: var(--secondary);
            font-size: 16px;
            line-height: 1.6;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            margin-top: 22px;
            padding: 0 20px;
            color: #FFFFFF;
            background: var(--macindex-blue);
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            opacity: .88;
        }

        a:focus-visible {
            outline: 3px solid rgba(13, 152, 186, .34);
            outline-offset: 4px;
        }

        .version {
            margin-top: 14px;
            font-size: 13px;
        }

        [hidden] {
            display: none;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text: #F2F5F6;
                --secondary: #B9C1C4;
                --background: #181B1D;
            }
        }
    </style>
</head>
<body>
<main>
    <img class="logo" src="macindexlogo.png" width="88" height="88" alt="MacIndex">
    <h1>MacIndex</h1>

    <div data-language="zh-CN" hidden>
        <p>没有自动打开？请点右上角，在浏览器中打开。</p>
        <p>尚未安装？前往 GitHub Releases。</p>
        <p class="version">需要 MacIndex 4.9 或更高版本。</p>
    </div>

    <div data-language="en">
        <p>Not opening? Tap the upper-right menu, then open in your browser.</p>
        <p>Need the app? Get it from GitHub Releases.</p>
        <p class="version">Requires MacIndex 4.9 or later.</p>
    </div>

    <a href="https://github.com/paizhangliu/MacIndex/releases">GitHub Releases</a>
</main>
<script>
    const language = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
    const selectedLanguage = language.toLowerCase().startsWith("zh") ? "zh-CN" : "en";
    document.documentElement.lang = selectedLanguage;
    document.title = selectedLanguage === "zh-CN" ? "在 MacIndex 中打开" : "Open in MacIndex";
    document.querySelectorAll("[data-language]").forEach(element => {
        element.hidden = element.dataset.language !== selectedLanguage;
    });
</script>
</body>
</html>
