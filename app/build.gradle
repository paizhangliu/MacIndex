plugins {
    id 'com.android.application'
    id 'com.google.android.gms.oss-licenses-plugin'
}

android {
    namespace = 'com.macindex.macindex'

    compileSdk = 37

    defaultConfig {
        applicationId 'com.macindex.macindex'
        minSdk 23
        targetSdk 36
        versionCode 31
        versionName '5.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    androidResources {
        // MediaPlayer.openFd() requires catalog audio to remain uncompressed in the APK.
        noCompress += ['flac']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def protobufVersion = '4.34.1'

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.datastore:datastore:1.2.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.browser:browser:1.10.0'
    implementation "com.google.protobuf:protobuf-javalite:${protobufVersion}"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    // 17.5.x requires API 24; retain 4.8.4's Android 6 (API 23) install base.
    implementation 'com.google.android.gms:play-services-oss-licenses:17.2.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20180813'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}

def catalogMachines = rootProject.file('catalog/machines')
def catalogUidSequence = rootProject.file('catalog/machine_uid_sequence')
def retiredCatalogMachines = rootProject.file('catalog/retired_machines.toml')
def catalogResources = rootProject.file('catalog/resources')
def generatedCatalogAssets = file("${layout.buildDirectory.get()}/generated/catalog/assets")
def generatedCatalogSource = file("${layout.buildDirectory.get()}/generated/catalog/source")
def generatedCatalogTextProto = new File(generatedCatalogSource, 'catalog.textproto')
def generatedCatalog = new File(generatedCatalogSource, 'catalog.pb')
def protoSources = file('src/main/proto')
def catalogProto = file('src/main/proto/catalog.proto')
def generatedProtoJava = file("${layout.buildDirectory.get()}/generated/source/proto/main/java")
def resourceManifest = rootProject.file('catalog/resource_manifest.json')
def catalogTaxonomy = rootProject.file('catalog/taxonomy.json')
def catalogSearchAliases = rootProject.file('catalog/search_aliases.json')
def normalizationGolden = rootProject.file('tools/tests/fixtures/normalization_golden.json')
def legacyMachineNames = rootProject.file('catalog/old_machine_names.json')

def normalizedOs = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def normalizedArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def configuredPython = findProperty('macindexPython') ?: System.getenv('MACINDEX_PYTHON')
def resolvedPythonExecutable
def requirePythonExecutable = {
    if (resolvedPythonExecutable != null) {
        return resolvedPythonExecutable
    }
    def candidates = configuredPython ? [configuredPython.toString()] : []
    if (!configuredPython && normalizedOs.contains('mac')) {
        candidates.addAll(['/opt/homebrew/bin/python3', '/usr/local/bin/python3'])
    }
    if (!configuredPython) {
        candidates.addAll(['python3', 'python'])
    }
    resolvedPythonExecutable = candidates.find { candidate ->
        try {
            def check = new ProcessBuilder(candidate, '-c',
                    'import sys, tomllib; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)')
                    .redirectErrorStream(true)
                    .start()
            check.inputStream.text
            return check.waitFor() == 0
        } catch (IOException ignored) {
            return false
        }
    }
    if (resolvedPythonExecutable == null) {
        def configurationHint = configuredPython
                ? "Configured Python is unavailable or older than 3.11: ${configuredPython}"
                : 'No Python 3.11+ interpreter was found'
        throw new GradleException("${configurationHint}. Set -PmacindexPython=/path/to/python3 "
                + 'or the MACINDEX_PYTHON environment variable.')
    }
    return resolvedPythonExecutable
}
def protocOs = normalizedOs.contains('mac') ? 'osx' :
        (normalizedOs.contains('win') ? 'windows' :
                (normalizedOs.contains('linux') ? 'linux' : null))
def protocArch = (normalizedArch == 'aarch64' || normalizedArch == 'arm64') ? 'aarch_64' :
        ((normalizedArch == 'x86_64' || normalizedArch == 'amd64') ? 'x86_64' : null)
def protocClassifier = protocOs != null && protocArch != null
        ? "${protocOs}-${protocArch}" : null

configurations {
    protocCompiler
}

dependencies {
    if (protocClassifier != null) {
        protocCompiler "com.google.protobuf:protoc:${protobufVersion}:${protocClassifier}@exe"
    }
}

def requireProtocCompiler = {
    if (protocClassifier == null) {
        throw new GradleException("Unsupported protoc host ${normalizedOs}/${normalizedArch}")
    }
    return configurations.protocCompiler.singleFile
}

android.sourceSets.main.assets.srcDir(generatedCatalogAssets)
android.sourceSets.main.java.srcDir(generatedProtoJava)

def generateProtoLite = tasks.register('generateProtoLite', Exec) {
    inputs.files(fileTree(protoSources) { include '**/*.proto' })
    outputs.dir(generatedProtoJava)
    doFirst {
        def compiler = requireProtocCompiler()
        if (!normalizedOs.contains('win') && !compiler.setExecutable(true)) {
            throw new GradleException("Unable to make protoc executable: ${compiler}")
        }
        delete(generatedProtoJava)
        generatedProtoJava.mkdirs()
        executable compiler
        args "--proto_path=${protoSources.absolutePath}",
                "--java_out=lite:${generatedProtoJava.absolutePath}"
        args fileTree(protoSources).matching { include '**/*.proto' }.files.sort()
    }
}

def generateCatalogTextProto = tasks.register('generateCatalogTextProto', Exec) {
    inputs.dir(catalogMachines)
    inputs.file(catalogUidSequence)
    inputs.file(retiredCatalogMachines)
    inputs.file(rootProject.file('tools/generate_catalog.py'))
    inputs.file(rootProject.file('tools/catalog_source.py'))
    inputs.file(rootProject.file('tools/catalog_resources.py'))
    inputs.file(rootProject.file('tools/catalog_search.py'))
    inputs.file(rootProject.file('tools/catalog_taxonomy.py'))
    inputs.file(resourceManifest)
    inputs.file(catalogTaxonomy)
    inputs.file(catalogSearchAliases)
    inputs.file(legacyMachineNames)
    inputs.dir(catalogResources)
    outputs.file(generatedCatalogTextProto)
    doFirst {
        generatedCatalogSource.mkdirs()
        commandLine requirePythonExecutable(), rootProject.file('tools/generate_catalog.py'),
                '--machines', catalogMachines,
                '--assets-root', catalogResources,
                '--retired-machines', retiredCatalogMachines,
                '--resource-manifest', resourceManifest,
                '--taxonomy', catalogTaxonomy,
                '--legacy-names', legacyMachineNames,
                '--search-aliases', catalogSearchAliases,
                '--output', generatedCatalogTextProto
    }
}

def generateCatalog = tasks.register('generateCatalog') {
    dependsOn generateCatalogTextProto
    inputs.file(generatedCatalogTextProto)
    inputs.files(fileTree(protoSources) { include '**/*.proto' })
    inputs.files(configurations.protocCompiler)
    inputs.property('protobufVersion', protobufVersion)
    outputs.file(generatedCatalog)
    doLast {
        generatedCatalogSource.mkdirs()
        def compiler = requireProtocCompiler()
        if (!normalizedOs.contains('win') && !compiler.setExecutable(true)) {
            throw new GradleException("Unable to make protoc executable: ${compiler}")
        }
        def temporaryCatalog = File.createTempFile(
                '.catalog.pb.', '.tmp', generatedCatalogSource)
        def diagnosticOutput = File.createTempFile(
                '.catalog.pb.stderr.', '.tmp', generatedCatalogSource)
        try {
            def command = [
                    compiler.absolutePath,
                    "--proto_path=${protoSources.absolutePath}",
                    '--encode=macindex.catalog.CatalogPayload',
                    '--deterministic_output',
                    catalogProto.absolutePath,
            ].collect { it.toString() }
            def process = new ProcessBuilder(command)
                    .redirectInput(generatedCatalogTextProto)
                    .redirectOutput(temporaryCatalog)
                    .redirectError(diagnosticOutput)
                    .start()
            def exitCode = process.waitFor()
            if (exitCode != 0) {
                def diagnostics = diagnosticOutput.exists()
                        ? diagnosticOutput.getText('UTF-8').trim() : ''
                throw new GradleException(
                        "protoc ${protobufVersion} failed to encode catalog.textproto"
                                + (diagnostics ? ":\n${diagnostics}" : ''))
            }
            def payload = temporaryCatalog.bytes
            if (generatedCatalog.exists()
                    && java.util.Arrays.equals(generatedCatalog.bytes, payload)) {
                delete(temporaryCatalog)
            } else {
                java.nio.file.Files.move(
                        temporaryCatalog.toPath(), generatedCatalog.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
            println("Encoded catalog with pinned protoc ${protobufVersion}, "
                    + "${payload.length} bytes.")
        } finally {
            delete(temporaryCatalog, diagnosticOutput)
        }
    }
}

def prepareCatalogAssets = tasks.register('prepareCatalogAssets', Sync) {
    dependsOn generateCatalog
    inputs.file(generatedCatalog)
    inputs.dir(catalogResources)
    into generatedCatalogAssets
    from(generatedCatalog) {
        into 'catalog'
    }
    from(catalogResources) {
        into 'catalog'
        include 'machines/*.webp'
        include 'logos/*.webp'
        include 'sounds/*.flac'
    }
}

def testCatalogTools = tasks.register('testCatalogTools', Exec) {
    inputs.files(rootProject.file('tools/catalog_source.py'),
            rootProject.file('tools/catalog_taxonomy.py'),
            rootProject.file('tools/catalog_resources.py'),
            rootProject.file('tools/catalog_search.py'))
    inputs.files(fileTree(rootProject.file('tools/tests')) {
        include '**/*.py'
        include '**/*.json'
    })
    doFirst {
        commandLine requirePythonExecutable(), '-m', 'unittest', 'discover',
                '-s', rootProject.file('tools/tests'), '-p', 'test_*.py'
    }
}

tasks.configureEach {
    if (name == 'preDebugBuild' || name == 'preReleaseBuild') {
        dependsOn prepareCatalogAssets, generateProtoLite
    }
    if (name == 'check') {
        dependsOn testCatalogTools
    }
}

tasks.withType(Test).configureEach {
    dependsOn generateCatalog
    inputs.file(normalizationGolden)
    systemProperty 'macindex.catalog.path', generatedCatalog.absolutePath
    systemProperty 'macindex.catalog.legacyNames.path', legacyMachineNames.absolutePath
    systemProperty 'macindex.catalog.normalization.path', normalizationGolden.absolutePath
}
