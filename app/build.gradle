plugins {
    id 'com.android.application'
    id 'com.google.android.gms.oss-licenses-plugin'
}

android {
    namespace = 'com.macindex.macindex'

    compileSdk = 37

    defaultConfig {
        applicationId 'com.macindex.macindex'
        minSdk 23
        targetSdk 36
        versionCode 29
        versionName '4.9.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'long', 'TIMESTAMP', System.currentTimeMillis() + 'L'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    androidResources {
        noCompress += ['flac']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.19.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.browser:browser:1.10.0'
    // 17.5.x requires API 24; retain 4.8.4's Android 6 (API 23) install base.
    implementation 'com.google.android.gms:play-services-oss-licenses:17.2.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

tasks.register('generateMachineIndexes', Exec) {
    commandLine 'python3', rootProject.file('tools/generate_machine_indexes.py'),
            file('src/main/assets/specs.db')
}

def verifyMachineIndexes = tasks.register('verifyMachineIndexes', Exec) {
    commandLine 'python3', rootProject.file('tools/generate_machine_indexes.py'), '--check',
            file('src/main/assets/specs.db')
}

tasks.configureEach {
    if (name == 'preReleaseBuild') {
        dependsOn verifyMachineIndexes
    }
}
