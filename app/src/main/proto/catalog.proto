syntax = "proto3";

package macindex.catalog;

option java_package = "com.macindex.macindex.catalog.proto";
option java_multiple_files = true;
option optimize_for = LITE_RUNTIME;

message CatalogPayload {
  repeated CatalogMachine machines = 1;
  repeated CatalogBrowseDefinition browse_definitions = 2;
}

message CatalogBrowseDefinition {
  string key = 1;
  repeated CatalogBrowseGroup groups = 2;
}

message CatalogBrowseGroup {
  string key = 1;
  string label = 2;
  optional string section_key = 3;
}

message CatalogMachine {
  string uid = 1;
  string manufacturer_key = 2;
  string product_type_key = 3;
  string picture_asset_key = 4;

  // The first name is canonical; subsequent values are legacy/search aliases.
  repeated CatalogIdentity names = 5;
  repeated CatalogIntroduction introductions = 6;
  repeated CatalogIdentity model_numbers = 7;
  repeated CatalogIdentity identifiers = 8;
  repeated CatalogIdentity gestalt_ids = 9;
  repeated CatalogIdentity order_numbers = 10;
  repeated CatalogIdentity codenames = 11;
  repeated CatalogIdentity emc_numbers = 12;

  optional string processor = 13;
  repeated string processor_family_keys = 14;
  repeated string processor_logo_keys = 15;
  repeated CatalogTextRange processor_model_ranges = 16;
  optional string graphics = 17;
  repeated string graphics_logo_keys = 18;
  repeated CatalogTextRange graphics_model_ranges = 19;

  optional string display = 20;
  optional string ram = 21;
  optional string rom = 22;
  optional string software = 23;
  optional string storage = 24;
  optional string features = 25;
  optional string expansion = 26;
  string design = 27;
  CatalogSupportStatus support_status = 28;
  CatalogSoundProfile sound_profile = 29;
  repeated CatalogExternalLink links = 30;
}

// One authored fact. The qualifier is displayed but is not part of search matching.
message CatalogIdentity {
  string value = 1;
  optional string qualifier = 2;
  // Part Numbers use this structured suffix metadata; other identities leave it empty.
  repeated string revisions = 3;
}

message CatalogIntroduction {
  uint32 year = 1;
  uint32 month = 2;
  optional string qualifier = 3;
}

message CatalogTextRange {
  uint32 start_inclusive = 1;
  uint32 end_exclusive = 2;
}

message CatalogExternalLink {
  string label = 1;
  string url = 2;
}

enum CatalogSupportStatus {
  CATALOG_SUPPORT_STATUS_UNSPECIFIED = 0;
  CATALOG_SUPPORT_STATUS_SUPPORTED = 1;
  CATALOG_SUPPORT_STATUS_VINTAGE = 2;
  CATALOG_SUPPORT_STATUS_OBSOLETE = 3;
  CATALOG_SUPPORT_STATUS_NOT_APPLICABLE = 4;
}

enum CatalogSoundProfile {
  CATALOG_SOUND_PROFILE_UNSPECIFIED = 0;
  CATALOG_SOUND_PROFILE_MACINTOSH_128K = 1;
  CATALOG_SOUND_PROFILE_MACINTOSH_II = 2;
  CATALOG_SOUND_PROFILE_MACINTOSH_LC = 3;
  CATALOG_SOUND_PROFILE_QUADRA = 4;
  CATALOG_SOUND_PROFILE_QUADRA_AV = 5;
  CATALOG_SOUND_PROFILE_POWER_MAC_6100 = 6;
  CATALOG_SOUND_PROFILE_POWER_MAC_5000 = 7;
  CATALOG_SOUND_PROFILE_POWER_MAC = 8;
  CATALOG_SOUND_PROFILE_NEW_WORLD = 9;
  CATALOG_SOUND_PROFILE_TWENTIETH_ANNIVERSARY = 10;
  CATALOG_SOUND_PROFILE_POWERBOOK = 11;
  CATALOG_SOUND_PROFILE_T2 = 12;
  CATALOG_SOUND_PROFILE_NONE = 13;
}
